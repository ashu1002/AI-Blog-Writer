  <rect x="80" y="300" width="1040" height="3" fill="#f97316" opacity="0.7"/>
  <text x="80" y="290" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" fill="#f97316" letter-spacing="2">DETECTION THRESHOLD</text>
  <text x="80" y="170" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="150" font-weight="800" fill="#ffffff">85%</text>
  <text x="80" y="228" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="38" font-weight="600" fill="#e2e8f0">of DDoS attacks stay under 1 Gbps</text>
  <text x="80" y="560" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="24" fill="#94a3b8">The majority nobody puts on a slide</text>
  <text x="1120" y="560" text-anchor="end" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" fill="#64748b">Nexusguard 2025 DDoS Trends Report</text>
