<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="hero-title">
  <title id="hero-title">85 percent of DDoS attacks remain under 1 Gbps</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.16" fill="#60a5fa">
    <rect x="80" y="470" width="14" height="40" rx="2"/><rect x="104" y="486" width="14" height="24" rx="2"/>
    <rect x="128" y="478" width="14" height="32" rx="2"/><rect x="152" y="492" width="14" height="18" rx="2"/>
    <rect x="176" y="482" width="14" height="28" rx="2"/><rect x="200" y="496" width="14" height="14" rx="2"/>
    <rect x="224" y="474" width="14" height="36" rx="2"/><rect x="248" y="490" width="14" height="20" rx="2"/>
    <rect x="272" y="484" width="14" height="26" rx="2"/><rect x="296" y="498" width="14" height="12" rx="2"/>
    <rect x="320" y="480" width="14" height="30" rx="2"/><rect x="344" y="494" width="14" height="16" rx="2"/>
